name: Deploy Web (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动把仓库 Pages 源切到 GitHub Actions，免手工设置
          enablement: true

      - name: 打包网页应用
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
