name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，需与 app/index.html 的 app-version 一致，构建时会自动同步）'
        required: true
        default: '1.0.0'
      publish:
        description: '构建完成后同时创建 GitHub Release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号格式应为 x.y.z，实际为：$VER"; exit 1
          fi
          MAJOR=$(printf '%s' "$VER" | cut -d. -f1)
          MINOR=$(printf '%s' "$VER" | cut -d. -f2)
          PATCH=$(printf '%s' "$VER" | cut -d. -f3)
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $VER / versionCode $CODE"

      - name: 同步网页端版本号
        run: |
          VER="${{ steps.ver.outputs.name }}"
          sed -i "s|<meta name=\"app-version\" content=\"[^\"]*\">|<meta name=\"app-version\" content=\"$VER\">|" app/index.html
          sed -i "s|id=\"appVer\">v[0-9.]*<|id=\"appVer\">v$VER<|" app/index.html
          grep -n "app-version" app/index.html

      - name: 准备签名密钥
        id: sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          KS="$RUNNER_TEMP/sign/release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            ALIAS="${KS_ALIAS:-qrverify}"
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "签名：使用仓库 Secrets 中的正式密钥"
          else
            ALIAS="qrverify"
            PASS="${KS_PASS:-qrverify-2026}"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 3072 -validity 10950 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CNZY QR Verify, O=CNZY Information Security, C=CN"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "签名：未配置 Secrets，本次临时生成密钥（见 keystore 产物），后续版本请复用以支持覆盖安装"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${KS_PASS:-qrverify-2026}" >> "$GITHUB_ENV"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 Release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 校验签名与产物
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "产物：$APK"
          SIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/qr-quality-verifier-${{ steps.ver.outputs.name }}.apk"
          ls -lh dist

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: qr-quality-verifier-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          retention-days: 90

      - name: 上传签名密钥（仅临时生成时）
        if: steps.sign.outputs.source == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: ${{ runner.temp }}/sign/release.keystore
          retention-days: 3

      - name: 创建 GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          {
            echo "## 二维码印刷质量测评 v$VER"
            echo ""
            echo "- 分级引擎：ISO/IEC 15415 七参数（SC/MOD/FPD/AN/GN/UEC）+ ISO/IEC 29158(AIM-DPM)"
            echo "- 逐块 Reed-Solomon 纠错计数，未用纠错 UEC 为实测值"
            echo "- 几何：四边形单应性 + 网格偏移搜索，支持旋转与透视"
            echo "- **盒条二维码合规测评**：按《盒条二维码技术要求》核验版本 3 / 纠错 M / 59 位编码 / 表2 尺寸 / 底框 / 套印（22 项），并按《盒条品规对应表》判定盒码·条码与品规名称"
            echo "- **件烟标签合规测评**：按 105×75mm 与表1/表2/表3 量测位置、尺寸、字号，35 项指标逐项给出偏差与中文结论"
            echo "- **应用内直接取景**：getUserMedia 真取景（原生 CAMERA 权限 + onPermissionRequest 授权），未授权自动回退系统相机/相册"
            echo "- 标签数据：二维码 105 位编码结构 + 一维码 GS1-128（自研解码，AI 解析与模 103 校验）"
            echo "- 修复：二维码页因命名空间冲突导致拍照/相册导入报错（reading 'quad'）"
            echo "- 结果页统一提供重新检测 / 复制结论 / 导出报告"
            echo ""
            echo "**安装**：下载 \`qr-quality-verifier-$VER.apk\`，允许未知来源安装即可。minSdk 24（Android 7.0+）。"
            echo ""
            echo "**网页版**：https://closerose-tech.github.io/qrcode-c/"
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "Release v$VER 已存在，改为上传/覆盖资产并更新说明"
            gh release upload "v$VER" "dist/qr-quality-verifier-$VER.apk" --clobber
            gh release edit "v$VER" --title "v$VER · 二维码印刷质量测评" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$VER" "dist/qr-quality-verifier-$VER.apk" \
              --title "v$VER · 二维码印刷质量测评" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "v$VER" --json url -q .url
